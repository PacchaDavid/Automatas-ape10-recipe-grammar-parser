<!--
  ==========================================================================
  vite.svg — Logo de Vite
  --------------------------------------------------------------------------
  Logotipo oficial de Vite con el característico patrón de
  iluminación púrpura sobre el triángulo estilizado "V".

  El logo usa:
    - fill="#9135ff" para el triángulo principal (púrpura)
    - Múltiples elipses con filtros blur para el efecto glow
    - Una clase .parenthesis para el color del paréntesis temático
      que se adapta al tema claro/oscuro via @media prefers-color-scheme

  Nota: Este archivo se incluye como asset estático. No se usa
  activamente en la UI actual.
  ==========================================================================
-->
<svg xmlns="http://www.w3.org/2000/svg" width="77" height="47" fill="none" aria-labelledby="vite-logo-title" viewBox="0 0 77 47">
  <title id="vite-logo-title">Vite</title>
  <!--
    .parenthesis: el paréntesis del nombre "Vite" cambia de color
    según el tema del sistema (negro en claro, blanco en oscuro).
  -->
  <style>.parenthesis{fill:#000}@media (prefers-color-scheme:dark){.parenthesis{fill:#fff}}</style>
  <path fill="#9135ff" d="M40.151 45.71c-.663.844-2.02.374-2.02-.699V34.708a2.26 2.26 0 0 0-2.262-2.262H24.493c-.92 0-1.457-1.04-.92-1.788l7.479-10.471c1.07-1.498 0-3.578-1.842-3.578H15.443c-.92 0-1.456-1.04-.92-1.788l9.696-13.576c.213-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.472c-1.07 1.497 0 3.578 1.842 3.578h11.376c.944 0 1.474 1.087.89 1.83L40.153 45.712z"/>
  <!--
    Máscara alpha para el efecto de iluminación interior.
    Define la silueta del logo.
  -->
  <mask id="a" width="48" height="47" x="14" y="0" maskUnits="userSpaceOnUse" style="mask-type:alpha">
    <path fill="#000" d="M40.047 45.71c-.663.843-2.02.374-2.02-.699V34.708a2.26 2.26 0 0 0-2.262-2.262H24.389c-.92 0-1.457-1.04-.92-1.788l7.479-10.472c1.07-1.497 0-3.578-1.842-3.578H15.34c-.92 0-1.456-1.04-.92-1.788l9.696-13.575c.213-.297.556-.474.92-.474H53.93c.92 0 1.456 1.04.92 1.788L47.37 13.03c-1.07 1.498 0 3.578 1.842 3.578h11.376c.944 0 1.474 1.088.89 1.831L40.049 45.712z"/>
  </mask>
  <!--
    Grupo de elipses con filtros gaussian blur superpuestas para
    crear el efecto de resplandor/glow púrpura dentro del logo.
  -->
  <g mask="url(#a)">
    <g filter="url(#b)">
      <ellipse cx="5.508" cy="14.704" fill="#eee6ff" rx="5.508" ry="14.704" transform="rotate(269.814 20.96 11.29)scale(-1 1)"/>
    </g>
    <g filter="url(#c)">
      <ellipse cx="10.399" cy="29.851" fill="#eee6ff" rx="10.399" ry="29.851" transform="rotate(89.814 -16.902 -8.275)scale(1 -1)"/>
    </g>
    <g filter="url(#d)">
      <ellipse cx="5.508" cy="30.487" fill="#8900ff" rx="5.508" ry="30.487" transform="rotate(89.814 -19.197 -7.127)scale(1 -1)"/>
    </g>
    <g filter="url(#e)">
      <ellipse cx="5.508" cy="30.599" fill="#8900ff" rx="5.508" ry="30.599" transform="rotate(89.814 -25.928 4.177)scale(1 -1)"/>
    </g>
    <g filter="url(#f)">
      <ellipse cx="5.508" cy="30.599" fill="#8900ff" rx="5.508" ry="30.599" transform="rotate(89.814 -25.738 5.52)scale(1 -1)"/>
    </g>
    <g filter="url(#g)">
      <ellipse cx="14.072" cy="22.078" fill="#eee6ff" rx="14.072" ry="22.078" transform="rotate(89.814 -12.159 2.411)scale(1 -1)"/>
    </g>
  </g>
  <!--
    Definiciones de filtros SVG: Gaussian blur con diferentes
    desviaciones estándar (0.5px a 25px) para las capas de glow.
  -->
  <defs>
    <filter id="b" width="1423.08" height="24.338" x="-604.379" y="-12.169" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur result="effect1_foregroundBlur" stdDeviation=".5"/>
    </filter>
    <filter id="c" width="1423.08" height="24.338" x="-604.379" y="-12.169" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur result="effect1_foregroundBlur" stdDeviation=".5"/>
    </filter>
    <filter id="d" width="235.231" height="24.338" x="-94.181" y="-12.169" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur result="effect1_foregroundBlur" stdDeviation="5"/>
    </filter>
    <filter id="e" width="235.231" height="24.338" x="-94.181" y="-12.169" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur result="effect1_foregroundBlur" stdDeviation="10"/>
    </filter>
    <filter id="f" width="235.231" height="24.338" x="-94.181" y="-12.169" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur result="effect1_foregroundBlur" stdDeviation="15"/>
    </filter>
    <filter id="g" width="235.231" height="24.338" x="-94.181" y="-12.169" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur result="effect1_foregroundBlur" stdDeviation="25"/>
    </filter>
  </defs>
</svg>
