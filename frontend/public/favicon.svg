<!--
  ==========================================================================
  favicon.svg — Favicon de la aplicación
  --------------------------------------------------------------------------
  Icono que se muestra en la pestaña del navegador (favicon).
  Adaptación del logo de Vite con el color púrpura característico.

  Nota: el atributo style con color(display-p3 ...) es una mejora de
  gama de color para pantallas P3 (Apple). Los navegadores que no
  soportan display-p3 usan el fallback fill="#863bff".
  ==========================================================================
-->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="46" fill="none" viewBox="0 0 48 46">
  <path fill="#863bff" d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z" style="fill:#863bff;fill:color(display-p3 .5252 .23 1);fill-opacity:1"/>
  <!--
    Máscara que define el área visible del gradiente/luz de fondo.
    style="mask-type:alpha" significa que la máscara usa el canal
    alpha de la imagen interna.
  -->
  <mask id="a" width="48" height="46" x="0" y="0" maskUnits="userSpaceOnUse" style="mask-type:alpha">
    <path fill="#000" d="M25.842 44.938c-.664.844-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.183c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.498 0-3.579-1.842-3.579H1.133c-.92 0-1.456-1.04-.92-1.787L9.91.473c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.578 1.842 3.578h11.377c.943 0 1.473 1.088.89 1.832L25.843 44.94z" style="fill:#000;fill-opacity:1"/>
  </mask>
  <!--
    Grupo de elipses con filtros blur que crean el efecto de
    iluminación/glow detrás del logo (solo visible con la máscara).
  -->
  <g mask="url(#a)">
    <g filter="url(#b)">
      <ellipse cx="5.508" cy="14.704" fill="#ede6ff" rx="5.508" ry="14.704" style="fill:#ede6ff;fill:color(display-p3 .9275 .9033 1);fill-opacity:1" transform="matrix(.00324 1 1 -.00324 -4.47 31.516)"/>
    </g>
    <g filter="url(#c)">
      <ellipse cx="10.399" cy="29.851" fill="#ede6ff" rx="10.399" ry="29.851" style="fill:#ede6ff;fill:color(display-p3 .9275 .9033 1);fill-opacity:1" transform="matrix(.00324 1 1 -.00324 -39.328 7.883)"/>
    </g>
    <g filter="url(#d)">
      <ellipse cx="5.508" cy="30.487" fill="#7e14ff" rx="5.508" ry="30.487" style="fill:#7e14ff;fill:color(display-p3 .4922 .0767 1);fill-opacity:1" transform="rotate(89.814 -25.913 -14.639)scale(1 -1)"/>
    </g>
    <g filter="url(#e)">
      <ellipse cx="5.508" cy="30.599" fill="#7e14ff" rx="5.508" ry="30.599" style="fill:#7e14ff;fill:color(display-p3 .4922 .0767 1);fill-opacity:1" transform="rotate(89.814 -32.644 -3.334)scale(1 -1)"/>
    </g>
    <g filter="url(#f)">
      <ellipse cx="5.508" cy="30.599" fill="#7e14ff" rx="5.508" ry="30.599" style="fill:#7e14ff;fill:color(display-p3 .4922 .0767 1);fill-opacity:1" transform="rotate(89.814 -44.068 18.974)scale(1 -1)"/>
    </g>
    <g filter="url(#g)">
      <ellipse cx="4.559" cy="30.599" fill="#7e14ff" rx="4.559" ry="30.599" style="fill:#7e14ff;fill:color(display-p3 .4922 .0767 1);fill-opacity:1" transform="rotate(89.814 -45.399 21.312)scale(1 -1)"/>
    </g>
    <g filter="url(#h)">
      <ellipse cx="5.508" cy="30.599" fill="#7e14ff" rx="5.508" ry="30.599" style="fill:#7e14ff;fill:color(display-p3 .4922 .0767 1);fill-opacity:1" transform="rotate(89.814 -42.445 19.764)scale(1 -1)"/>
    </g>
    <g filter="url(#i)">
      <ellipse cx="5.508" cy="30.599" fill="#7e14ff" rx="5.508" ry="30.599" style="fill:#7e14ff;fill:color(display-p3 .4922 .0767 1);fill-opacity:1" transform="rotate(89.814 -41.67 20.622)scale(1 -1)"/>
    </g>
    <g filter="url(#j)">
      <ellipse cx="5.508" cy="30.599" fill="#eee6ff" rx="5.508" ry="30.599" style="fill:#eee6ff;fill:color(display-p3 .9275 .9033 1);fill-opacity:1" transform="rotate(89.814 -38.601 20.56)scale(1 -1)"/>
    </g>
  </g>
  <!--
    Definiciones de filtros blur. Cada filtro aplica un desenfoque
    gaussiano de diferente intensidad (0.5px a 15px) para crear
    las capas de glow/iluminación.
  -->
  <defs>
    <filter id="b" width="1157.09" height="24.338" x="-489.706" y="-12.169" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur result="effect1_foregroundBlur" stdDeviation=".5"/>
    </filter>
    <filter id="c" width="1157.09" height="24.338" x="-489.706" y="-12.169" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur result="effect1_foregroundBlur" stdDeviation=".5"/>
    </filter>
    <filter id="d" width="235.231" height="24.338" x="-94.181" y="-12.169" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur result="effect1_foregroundBlur" stdDeviation="2.5"/>
    </filter>
    <filter id="e" width="235.231" height="24.338" x="-94.181" y="-12.169" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur result="effect1_foregroundBlur" stdDeviation="2.5"/>
    </filter>
    <filter id="f" width="235.231" height="24.338" x="-94.181" y="-12.169" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur result="effect1_foregroundBlur" stdDeviation="2.5"/>
    </filter>
    <filter id="g" width="194.766" height="24.338" x="-77.709" y="-12.169" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur result="effect1_foregroundBlur" stdDeviation="2"/>
    </filter>
    <filter id="h" width="235.231" height="24.338" x="-94.181" y="-12.169" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur result="effect1_foregroundBlur" stdDeviation="5"/>
    </filter>
    <filter id="i" width="235.231" height="24.338" x="-94.181" y="-12.169" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur result="effect1_foregroundBlur" stdDeviation="10"/>
    </filter>
    <filter id="j" width="235.231" height="24.338" x="-94.181" y="-12.169" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur result="effect1_foregroundBlur" stdDeviation="15"/>
    </filter>
  </defs>
</svg>
